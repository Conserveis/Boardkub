<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Instrument+Serif&family=Inter:wght@400;500;600&family=Noto+Serif+Thai:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>BoardKub — เว็บบอร์ดนักศึกษา</title>
</head>
<body class="landing">
<header class="topbar">
  <div class="inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"><img src="img/plane.svg" alt=""></span>
      <span class="brand-name">BoardKub</span>
    </a>
    <div class="navpill">
      <a href="index.html">หน้าแรก</a>
      <a href="categories.html">หมวดหมู่</a>
      <div class="searchbox">
        <label class="visually-hidden" for="search-input">ค้นหากระทู้</label>
        <input type="search" id="search-input" placeholder="ค้นหากระทู้ เช่น ทุน กยศ.">
      </div>
    </div>
    <nav class="topnav" id="nav-area"></nav>
  </div>
</header>
<section class="hero hero-full">
  <div class="flight" aria-hidden="true">
    <svg class="trail" viewBox="0 0 400 80" preserveAspectRatio="none"><path d="M2 76 C 120 70, 260 50, 398 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <img class="plane" src="img/plane.svg" alt="">
  </div>
  <h1>ถามมา ตอบไป<br>หาเจอทุกครั้ง</h1>
  <p>เว็บบอร์ดของนักศึกษา รวมเรื่องทุน วิชาเรียน และกิจกรรมไว้ในที่เดียว แยกเป็นหมวดหมู่ ทุกกระทู้มีที่อยู่ถาวร ค้นย้อนหลังได้เสมอ</p>
  <div class="hero-actions">
    <a class="btn sun" href="categories.html">เข้าสู่เว็บบอร์ด</a>
    <a class="btn hero-ghost" id="hero-join" href="register.html">สมัครสมาชิก</a>
  </div>
  <p class="footnote hero-pod"><span id="podbar"></span></p>
</section>

<script src="js/app.js"></script>
<script>
(async function () {
  await initPage('');
  if (CURRENT_USER) {
    const j = document.getElementById('hero-join');
    if (j) j.remove();
  }
})();
</script>
</body>
</html>
