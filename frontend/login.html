<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Instrument+Serif&family=Inter:wght@400;500;600&family=Noto+Serif+Thai:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>เข้าสู่ระบบ — BoardKub</title>
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"><img src="img/plane.svg" alt=""></span>
      <span class="brand-name">BoardKub</span>
    </a>
    <div class="navpill">
      <a href="index.html">หน้าแรก</a>
      <a href="categories.html">หมวดหมู่</a>
      <div class="searchbox">
        <label class="visually-hidden" for="search-input">ค้นหากระทู้</label>
        <input type="search" id="search-input" placeholder="ค้นหากระทู้ เช่น ทุน กยศ.">
      </div>
    </div>
    <nav class="topnav" id="nav-area"></nav>
  </div>
</header>
<main class="auth">
  <h1>เข้าสู่ระบบ</h1>
  <p class="sub">ใช้อีเมลที่ยืนยันแล้วเพื่อเข้าสู่ระบบ</p>
  <div id="alert" class="alert"></div>
  <div class="panel">
    <div class="field">
      <label for="email">อีเมล</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@kmitl.ac.th">
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button type="button" class="btn block" id="submit">เข้าสู่ระบบ</button>
    <p class="foot">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
  </div>
  <p class="footnote"><span id="podbar"></span></p>
</main>
<script src="js/app.js"></script>
<script>
(async function () {
  await initPage();
  const next = qs('next') || 'categories.html';
  if (CURRENT_USER) { location.href = next; return; }

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { showAlert('alert', 'กรุณากรอกอีเมลและรหัสผ่าน'); return; }
    const btn = document.getElementById('submit');
    btn.disabled = true;
    try {
      await API.login({ email: email, password: password });
      location.href = next;
    } catch (e) {
      if (e.status === 403) {
        showAlert('alert', e.message);
        document.getElementById('alert').innerHTML = esc(e.message) +
          ' <a href="verify.html?email=' + encodeURIComponent(email) + '">ยืนยันอีเมลที่นี่</a>';
      } else {
        showAlert('alert', e.message);
      }
      btn.disabled = false;
    }
  }

  document.getElementById('submit').onclick = doLogin;
  document.getElementById('password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });
})();
</script>
</body>
</html>
