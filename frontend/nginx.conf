server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 512;

    # Health endpoint for the Kubernetes probes
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Pages, CSS and JS: the browser re-checks on every load, so a new
    # deployment shows up immediately instead of an old cached page
    location / {
        expires epoch;
        try_files $uri $uri/ =404;
    }

    # Decorative images rarely change
    location /img/ {
        expires 7d;
    }

    # Proxy API calls to the backend Service (same name in compose and in k8s)
    location /api/ {
        # Image uploads: Spring Boot accepts up to 6 MB per request
        client_max_body_size 8m;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
