<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Instrument+Serif&family=Inter:wght@400;500;600&family=Noto+Serif+Thai:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>กระทู้ — BoardKub</title>
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"><img src="img/plane.svg" alt=""></span>
      <span class="brand-name">BoardKub</span>
    </a>
    <div class="navpill">
      <a href="index.html">หน้าแรก</a>
      <a href="categories.html">หมวดหมู่</a>
      <div class="searchbox">
        <label class="visually-hidden" for="search-input">ค้นหากระทู้</label>
        <input type="search" id="search-input" placeholder="ค้นหากระทู้ เช่น ทุน กยศ.">
      </div>
    </div>
    <nav class="topnav" id="nav-area"></nav>
  </div>
</header>
<main class="wrap narrow">
  <p class="crumb" id="crumb"></p>
  <div id="alert" class="alert"></div>

  <article class="post-detail" id="post-card"><div class="loading">กำลังโหลด...</div></article>

  <section>
    <h2 class="comments-head" id="comments-head">ความคิดเห็น</h2>
    <div id="comments"><div class="loading">กำลังโหลด...</div></div>
    <div id="comment-form-area" style="margin-top:22px;padding-top:20px;border-top:1px solid var(--rule-strong)"></div>
  </section>

  <p class="footnote"><span id="podbar"></span></p>
</main>
<script src="js/app.js"></script>
<script>
(async function () {
  await initPage();
  const postId = qs('id');
  if (!postId) { location.href = 'categories.html'; return; }

  async function loadPost() {
    try {
      const p = await API.post(postId);
      document.title = p.title + ' — BoardKub';
      document.getElementById('crumb').innerHTML =
        '<a href="categories.html?view=all">หมวดหมู่</a> › ' +
        '<a href="category.html?id=' + p.categoryId + '">' + esc(p.categoryName) + '</a>' +
        ' › <a href="board.html?id=' + p.boardId + '">' + esc(p.boardName) + '</a>';

      const actions = p.canEdit
        ? '<div class="btn-row"><a class="btn ghost sm" href="new-post.html?editId=' + p.id + '">แก้ไข</a>' +
          '<button type="button" class="btn danger sm" id="del-post">ลบกระทู้</button></div>'
        : '';

      document.getElementById('post-card').innerHTML =
        '<h1>' + esc(p.title) + '</h1>' +
        '<p class="meta">' + authorLink(p.authorName, p.authorId) + ' · ' + timeAgo(p.createdAt) +
        (p.updatedAt ? ' · แก้ไข ' + timeAgo(p.updatedAt) : '') +
        ' · ' + p.viewCount + ' เข้าชม</p>' +
        '<div class="post-body">' + esc(p.content) + '</div>' +
        renderImages(p.images || []) + actions;

      const del = document.getElementById('del-post');
      if (del) {
        del.onclick = async function () {
          if (!confirm('ยืนยันการลบกระทู้นี้? การลบไม่สามารถย้อนกลับได้')) return;
          try {
            await API.deletePost(postId);
            location.href = 'board.html?id=' + p.boardId;
          } catch (e) { showAlert('alert', e.message); }
        };
      }
    } catch (e) {
      document.getElementById('post-card').innerHTML = '';
      showAlert('alert', e.message);
    }
  }

  function renderImages(images) {
    const ok = images.filter(function (im) { return safeImageUrl(im.url); });
    if (!ok.length) return '';
    return '<div class="post-images count-' + Math.min(ok.length, 4) + '">' + ok.map(function (im, i) {
      const url = esc(im.url);
      return '<a href="' + url + '" target="_blank" rel="noopener">' +
        '<img src="' + url + '" loading="lazy" width="' + im.width + '" height="' + im.height +
        '" alt="รูปประกอบที่ ' + (i + 1) + '"></a>';
    }).join('') + '</div>';
  }

  async function loadComments() {
    const box = document.getElementById('comments');
    try {
      const list = await API.comments(postId);
      document.getElementById('comments-head').textContent = 'ความคิดเห็น ' + list.length + ' รายการ';
      if (!list.length) {
        box.innerHTML = '<div class="empty" style="padding:26px">ยังไม่มีความคิดเห็น</div>';
        return;
      }
      box.innerHTML = list.map(function (c) {
        const acts = c.canEdit
          ? '<span class="c-actions">' +
            '<button type="button" class="btn ghost sm" data-edit="' + c.id + '">แก้ไข</button>' +
            '<button type="button" class="btn danger sm" data-del="' + c.id + '">ลบ</button></span>'
          : '';
        return '<div class="comment"><div class="c-head">' +
          '<span class="c-author">' + authorLink(c.authorName, c.authorId) + '</span>' +
          (c.authorRole === 'ADMIN' ? '<span class="tag-admin">ผู้ดูแล</span>' : '') +
          '<span class="c-time">' + timeAgo(c.createdAt) + (c.updatedAt ? ' (แก้ไขแล้ว)' : '') + '</span>' +
          acts + '</div>' +
          '<div class="c-body" data-body="' + c.id + '">' + esc(c.content) + '</div></div>';
      }).join('');
      bindActions(list);
    } catch (e) {
      box.innerHTML = '';
      showAlert('alert', e.message);
    }
  }

  function bindActions(list) {
    document.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.onclick = async function () {
        if (!confirm('ยืนยันการลบความคิดเห็นนี้?')) return;
        try { await API.deleteComment(btn.dataset.del); loadComments(); }
        catch (e) { showAlert('alert', e.message); }
      };
    });
    document.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.onclick = function () {
        const id = btn.dataset.edit;
        const current = list.find(function (c) { return String(c.id) === String(id); });
        const body = document.querySelector('[data-body="' + id + '"]');
        body.innerHTML = '<textarea id="edit-' + id + '" style="min-height:90px"></textarea>' +
          '<div class="btn-row"><button type="button" class="btn sm" id="save-' + id + '">บันทึก</button>' +
          '<button type="button" class="btn ghost sm" id="cancel-' + id + '">ยกเลิก</button></div>';
        document.getElementById('edit-' + id).value = current.content;
        document.getElementById('save-' + id).onclick = async function () {
          const val = document.getElementById('edit-' + id).value.trim();
          if (!val) return;
          try { await API.updateComment(id, { content: val }); loadComments(); }
          catch (e) { showAlert('alert', e.message); }
        };
        document.getElementById('cancel-' + id).onclick = loadComments;
      };
    });
  }

  function renderCommentForm() {
    const area = document.getElementById('comment-form-area');
    if (!CURRENT_USER) {
      area.innerHTML = '<p class="hint"><a href="login.html?next=' +
        encodeURIComponent(location.pathname + location.search) +
        '">เข้าสู่ระบบ</a> เพื่อแสดงความคิดเห็น</p>';
      return;
    }
    area.innerHTML =
      '<label for="new-comment">แสดงความคิดเห็น</label>' +
      '<textarea id="new-comment" placeholder="พิมพ์ความคิดเห็นของคุณ..."></textarea>' +
      '<div class="btn-row"><button type="button" class="btn" id="submit-comment">ส่งความคิดเห็น</button></div>';

    document.getElementById('submit-comment').onclick = async function () {
      const val = document.getElementById('new-comment').value.trim();
      if (!val) { showAlert('alert', 'กรุณาพิมพ์ความคิดเห็นก่อนส่ง'); return; }
      this.disabled = true;
      try {
        await API.addComment(postId, { content: val });
        document.getElementById('new-comment').value = '';
        hideAlert('alert');
        await loadComments();
      } catch (e) { showAlert('alert', e.message); }
      finally { this.disabled = false; }
    };
  }

  await loadPost();
  await loadComments();
  renderCommentForm();
})();
</script>
</body>
</html>
