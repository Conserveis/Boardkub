<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Instrument+Serif&family=Inter:wght@400;500;600&family=Noto+Serif+Thai:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>สมัครสมาชิก — BoardKub</title>
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"><img src="img/plane.svg" alt=""></span>
      <span class="brand-name">BoardKub</span>
    </a>
    <div class="navpill">
      <a href="index.html">หน้าแรก</a>
      <a href="categories.html">หมวดหมู่</a>
      <div class="searchbox">
        <label class="visually-hidden" for="search-input">ค้นหากระทู้</label>
        <input type="search" id="search-input" placeholder="ค้นหากระทู้ เช่น ทุน กยศ.">
      </div>
    </div>
    <nav class="topnav" id="nav-area"></nav>
  </div>
</header>
<main class="auth">
  <h1>สมัครสมาชิก</h1>
  <p class="sub">สมัครแล้วระบบจะส่งรหัส OTP ไปยังอีเมลเพื่อยืนยันตัวตน</p>
  <div id="alert" class="alert"></div>
  <div class="panel">
    <div class="field">
      <label for="displayName">ชื่อที่แสดง</label>
      <input type="text" id="displayName" maxlength="60" placeholder="เช่น สมชาย ใจดี">
    </div>
    <div class="field">
      <label for="email">อีเมล</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@kmitl.ac.th">
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" autocomplete="new-password">
      <p class="hint">อย่างน้อย 8 ตัวอักษร</p>
    </div>
    <button type="button" class="btn block" id="submit">สมัครสมาชิก</button>
    <p class="foot">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
  </div>
  <p class="footnote"><span id="podbar"></span></p>
</main>
<script src="js/app.js"></script>
<script>
(async function () {
  await initPage();
  if (CURRENT_USER) { location.href = 'categories.html'; return; }

  document.getElementById('submit').onclick = async function () {
    const displayName = document.getElementById('displayName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!displayName || !email || !password) { showAlert('alert', 'กรุณากรอกข้อมูลให้ครบทุกช่อง'); return; }
    if (password.length < 8) { showAlert('alert', 'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร'); return; }

    this.disabled = true;
    try {
      await API.register({ email: email, password: password, displayName: displayName });
      location.href = 'verify.html?email=' + encodeURIComponent(email);
    } catch (e) { showAlert('alert', e.message); this.disabled = false; }
  };
})();
</script>
</body>
</html>
