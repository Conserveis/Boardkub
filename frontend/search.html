<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Instrument+Serif&family=Inter:wght@400;500;600&family=Noto+Serif+Thai:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>ผลการค้นหา — BoardKub</title>
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"><img src="img/plane.svg" alt=""></span>
      <span class="brand-name">BoardKub</span>
    </a>
    <div class="navpill">
      <a href="index.html">หน้าแรก</a>
      <a href="categories.html">หมวดหมู่</a>
      <div class="searchbox">
        <label class="visually-hidden" for="search-input">ค้นหากระทู้</label>
        <input type="search" id="search-input" placeholder="ค้นหากระทู้ เช่น ทุน กยศ.">
      </div>
    </div>
    <nav class="topnav" id="nav-area"></nav>
  </div>
</header>
<main class="wrap narrow">
  <div class="page-head">
    <h1>ผลการค้นหา</h1>
    <p id="sub"></p>
  </div>
  <div id="alert" class="alert"></div>
  <div id="result"><div class="loading">กำลังค้นหา...</div></div>
  <div class="pager" id="pager"></div>
</main>
<script src="js/app.js"></script>
<script>
(async function () {
  const q = qs('q') || '';
  await initPage(q);
  if (!q.trim()) { location.href = 'categories.html'; return; }

  document.getElementById('sub').textContent = 'คำค้นหา: "' + q + '"';
  let page = 0;
  const size = 10;

  async function load() {
    const box = document.getElementById('result');
    box.innerHTML = '<div class="loading">กำลังค้นหา...</div>';
    try {
      const data = await API.search(q, page, size);
      if (!data.items.length) {
        box.innerHTML = '<div class="empty">ไม่พบกระทู้ที่ตรงกับคำค้นหานี้</div>';
        document.getElementById('pager').innerHTML = '';
        return;
      }
      document.getElementById('sub').textContent =
        'คำค้นหา: "' + q + '" — พบ ' + data.totalItems + ' กระทู้';
      box.innerHTML = data.items.map(function (p) {
        return '<div class="post-row">' +
          '<span class="post-count"><span class="n' + (p.commentCount ? '' : ' zero') + '">' +
          p.commentCount + '</span><span class="l">ตอบ</span></span>' +
          '<span class="post-main">' +
          '<a class="p-title" href="post.html?id=' + p.id + '">' + esc(p.title) + '</a>' +
          '<span class="p-meta">ใน ' + esc(p.boardName) + ' · ' + esc(p.authorName) +
          ' · ' + timeAgo(p.createdAt) + ' · ' + p.viewCount + ' เข้าชม</span></span></div>';
      }).join('');

      const pager = document.getElementById('pager');
      const nav = data.totalPages > 1
        ? '<button type="button" class="btn ghost sm" id="prev"' + (page <= 0 ? ' disabled' : '') + '>ก่อนหน้า</button>' +
          '<span class="pinfo">หน้า ' + (data.page + 1) + ' / ' + data.totalPages + '</span>' +
          '<button type="button" class="btn ghost sm" id="next"' + (page >= data.totalPages - 1 ? ' disabled' : '') + '>ถัดไป</button>'
        : '';
      pager.innerHTML = nav + '<span class="podbar" id="podbar"></span>';
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      if (prev) prev.onclick = function () { page--; load(); window.scrollTo(0, 0); };
      if (next) next.onclick = function () { page++; load(); window.scrollTo(0, 0); };
      renderPodBar();
    } catch (e) {
      box.innerHTML = '';
      showAlert('alert', e.message);
    }
  }
  load();
})();
</script>
</body>
</html>
