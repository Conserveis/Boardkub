# The backend accepts traffic only from:
#   - frontend Pods (Nginx proxies /api/ to the backend Service)
#   - the CI smoke-test Pod (label app=smoke-test)
#   - Google Cloud Load Balancing proxies and health checks
#     (130.211.0.0/22, 35.191.0.0/16), which reach Pods directly through NEGs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - podSelector:
            matchLabels:
              app: smoke-test
        - ipBlock: { cidr: 130.211.0.0/22 }
        - ipBlock: { cidr: 35.191.0.0/16 }
      ports:
        - port: 8080
          protocol: TCP
