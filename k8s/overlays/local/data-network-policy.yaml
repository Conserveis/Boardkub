# The data tier accepts connections from the backend Pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-tier-backend-only
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mysql", "redis"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
