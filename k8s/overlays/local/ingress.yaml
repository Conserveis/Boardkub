# NGINX Ingress (minikube: `minikube addons enable ingress`).
# Everything goes to the frontend; its Nginx proxies /api/ to the backend.
# Add "<minikube ip>  boardkub.local" to /etc/hosts, then open http://boardkub.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boardkub
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: boardkub.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
