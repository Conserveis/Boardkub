# GKE Ingress -> external Application Load Balancer (global).
#   /api/*  -> backend  (actuator endpoints are NOT exposed: they are not under /api)
#   /*      -> frontend
# Prerequisites created by scripts/gcp-setup.sh:
#   - global static IP "boardkub-ip"       (point your domain's A record at it)
#   - Cloud Armor policy "boardkub-armor"  (referenced in gke-lb-config.yaml)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boardkub
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "boardkub-ip"
    networking.gke.io/managed-certificates: "boardkub-cert"
    networking.gke.io/v1beta1.FrontendConfig: "boardkub-frontend-config"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
